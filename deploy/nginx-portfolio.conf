# nginx site for the portfolio.
# Install:  sudo cp deploy/nginx-portfolio.conf /etc/nginx/sites-available/portfolio
#           sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#           sudo rm /etc/nginx/sites-enabled/default      # if the default site is still enabled
#           sudo nginx -t && sudo systemctl reload nginx
# Replace example.com with your domain (or your Linode's IP address for now).

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Photo uploads and editor saves are bigger than nginx's 1 MB default.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required: the app checks these.
        proxy_set_header Host              $host;                       # login is rejected without it
        proxy_set_header X-Real-IP         $remote_addr;                # real IP for the login lockout
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;                     # tells the app when it's HTTPS
    }
}

# Adding HTTPS later:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot adds the 443 block and keeps these proxy settings. No app changes are needed:
# the session cookie becomes Secure automatically on HTTPS requests.
