<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f8f6fd; --text: #1f1d2b; --muted: #555366; --border: rgba(146,128,214,0.3); --accent: #6a4fc0; --error: #b42318; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #070b18; --text: #e8eaf2; --muted: #a3a9bb; --border: rgba(255,255,255,0.12); --accent: #f5934a; --error: #ff8a80; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: 'Inter', system-ui, sans-serif; color: var(--text);
      background: radial-gradient(ellipse at 15% 10%, rgba(205,188,255,0.35), transparent 60%), radial-gradient(ellipse at 85% 90%, rgba(255,199,225,0.25), transparent 60%), var(--bg);
    }
    form {
      width: 100%; max-width: 380px; padding: 32px 28px; border-radius: 18px;
      border: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 70%, white 10%);
      box-shadow: 0 16px 40px -12px rgba(100, 80, 180, 0.25);
    }
    h1 { font-family: 'Fraunces', Georgia, serif; font-size: 1.6rem; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%; font: inherit; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; margin-top: 16px; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { color: var(--error); font-size: 0.9rem; margin: 12px 0 0; min-height: 1.2em; }
    a { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 0.88rem; }
  </style>
</head>
<body>
  <form id="login" autocomplete="on">
    <h1>Admin login</h1>
    <p>Sign in to edit your portfolio.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
    <button type="submit">Log in</button>
    <div class="error" id="error" role="alert"></div>
    <a href="/">← Back to site</a>
  </form>
  <script nonce="{{NONCE}}">
    document.getElementById('login').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = this.querySelector('button'), err = document.getElementById('error'), input = document.getElementById('password');
      btn.disabled = true; err.textContent = '';
      try {
        var res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
          body: JSON.stringify({ password: input.value })
        });
        var body = await res.json().catch(function () { return {}; });
        if (res.ok) { location.replace('/admin'); return; }
        err.textContent = body.error || 'Login failed.';
        input.value = ''; input.focus();
      } catch (ex) {
        err.textContent = 'Could not reach the server.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
