<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Edit site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4fb; --panel: #ffffff; --panel-2: #f8f6fd; --text: #1f1d2b; --muted: #5a586c; --border: #e3def2;
      --accent: #6a4fc0; --accent-soft: rgba(106,79,192,0.1); --danger: #b42318; --ok: #0f7a4c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0f1d; --panel: #131a2c; --panel-2: #182036; --text: #e8eaf2; --muted: #a3a9bb; --border: #263049;
        --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.14); --danger: #ff8a80; --ok: #6fd3a8; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; color: var(--text); background: var(--bg); line-height: 1.5; }

    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-family: 'Fraunces', Georgia, serif; font-size: 1.2rem; margin: 0 auto 0 0; }
    .status { font-size: 0.88rem; color: var(--muted); }
    .status.dirty { color: #b4500f; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }

    button, .btn {
      font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    button:hover, .btn:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button.small { padding: 4px 10px; font-size: 0.8rem; }
    button.icon { width: 30px; height: 30px; padding: 0; justify-content: center; }

    .layout { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .jump a { font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; }

    details.section { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; scroll-margin-top: 80px; }
    details.section > summary { cursor: pointer; padding: 16px 20px; font-weight: 600; font-size: 1.05rem; list-style: none; display: flex; align-items: center; gap: 10px; }
    details.section > summary::before { content: '▸'; color: var(--accent); transition: transform 0.2s; }
    details.section[open] > summary::before { transform: rotate(90deg); }
    .section-body { padding: 0 20px 20px; display: grid; gap: 14px; }

    .field { display: grid; gap: 5px; }
    .field > span { font-size: 0.82rem; font-weight: 500; color: var(--muted); }
    .field small { color: var(--muted); font-size: 0.78rem; }
    input[type=text], textarea, select {
      width: 100%; font: inherit; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text);
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }

    .list { display: grid; gap: 12px; }
    .item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--panel-2); display: grid; gap: 12px; }
    .item-head { display: flex; align-items: center; gap: 6px; }
    .item-head strong { margin-right: auto; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .image-field { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .image-field img { width: 72px; height: 72px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border); }
    .file-btn { position: relative; overflow: hidden; }
    .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .cat { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--panel-2); display: grid; gap: 12px; }
    .cat-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .cat-head input { flex: 1; min-width: 160px; font-weight: 600; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .photo { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: grid; }
    .photo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
    .photo .controls { padding: 8px; display: grid; gap: 6px; }
    .photo .row { display: flex; gap: 4px; }
    .photo .row select { flex: 1; font-size: 0.8rem; padding: 4px 6px; }
    .photo input, .photo textarea { font-size: 0.82rem; padding: 6px 8px; }
    .empty { color: var(--muted); font-size: 0.88rem; font-style: italic; }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .upload-status { font-size: 0.85rem; color: var(--muted); }

    @media (max-width: 600px) {
      .topbar { padding: 10px 12px; }
      .topbar h1 { width: 100%; }
      .section-body { padding: 0 14px 16px; }
      details.section > summary { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Edit site</h1>
    <span class="status" id="status" role="status">All changes saved</span>
    <a class="btn" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="primary" id="save" type="button" disabled>Save changes</button>
    <button id="logout" type="button">Log out</button>
  </div>
  <div class="layout">
    <p class="hint" style="margin-bottom:12px">Tip: wrap words in **double asterisks** to make them <strong>bold</strong>, or *single asterisks* for <em>italics</em>. Changes go live when you click <b>Save changes</b>.</p>
    <nav class="jump" id="jump"></nav>
    <div id="editor"></div>
  </div>

  <script id="site-data" type="application/json">{{DATA}}</script>
  <script nonce="{{NONCE}}">
  (function () {
    'use strict';
    var state = JSON.parse(document.getElementById('site-data').textContent);
    var dirty = false;
    var statusEl = document.getElementById('status');
    var saveBtn = document.getElementById('save');

    function el(tag, props) {
      var e = document.createElement(tag);
      props = props || {};
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'value') e.value = v;
        else if (k === 'checked') e.checked = !!v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      });
      for (var i = 2; i < arguments.length; i++) {
        var kids = [].concat(arguments[i]);
        kids.forEach(function (kid) { if (kid != null && kid !== false) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); });
      }
      return e;
    }
    function api(url, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ 'X-Requested-With': 'fetch' }, opts.headers || {});
      opts.credentials = 'same-origin';
      return fetch(url, opts);
    }
    function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }
    function markDirty() { dirty = true; saveBtn.disabled = false; setStatus('Unsaved changes', 'dirty'); }
    function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

    // ---------- field types ----------
    function textField(obj, key, label, opts) {
      opts = opts || {};
      var input = el(opts.multiline ? 'textarea' : 'input', { type: opts.multiline ? null : 'text', value: obj[key] || '', rows: opts.rows || null,
        oninput: function () { obj[key] = input.value; markDirty(); if (opts.onchange) opts.onchange(); } });
      return el('label', { class: 'field' }, el('span', { text: label }), input, opts.help && el('small', { text: opts.help }));
    }
    function linesField(obj, key, label, help, splitter) {
      var isParas = splitter === 'paras';
      var join = isParas ? '\n\n' : '\n';
      var input = el('textarea', { rows: Math.min(12, Math.max(3, (obj[key] || []).length * (isParas ? 3 : 1) + 1)), value: (obj[key] || []).join(join),
        oninput: function () {
          obj[key] = input.value.split(isParas ? /\n\s*\n/ : /\n/).map(function (s) { return s.trim(); }).filter(Boolean);
          markDirty();
        } });
      return el('label', { class: 'field' }, el('span', { text: label }), input, help && el('small', { text: help }));
    }
    function statsField(obj, key, label) {
      var input = el('textarea', { rows: 3, value: (obj[key] || []).map(function (s) { return s.value + ' | ' + s.label; }).join('\n'),
        oninput: function () {
          obj[key] = input.value.split('\n').map(function (line) {
            var parts = line.split('|'); var v = (parts[0] || '').trim(); var l = parts.slice(1).join('|').trim();
            return v ? { value: v, label: l } : null;
          }).filter(Boolean);
          markDirty();
        } });
      return el('label', { class: 'field' }, el('span', { text: label }), input, el('small', { text: 'One per line, like:  +35% | conversion' }));
    }
    function boolField(obj, key, label) {
      var input = el('input', { type: 'checkbox', checked: obj[key], onchange: function () { obj[key] = input.checked; markDirty(); } });
      return el('label', { class: 'check' }, input, label);
    }
    function imageField(obj, key, label) {
      var img = el('img', { src: obj[key] || '', alt: '' });
      var status = el('span', { class: 'upload-status' });
      var file = el('input', { type: 'file', accept: 'image/*', onchange: async function () {
        if (!file.files[0]) return;
        status.textContent = 'Uploading…';
        try { obj[key] = await uploadImage(file.files[0], 1200); img.src = obj[key]; status.textContent = 'Uploaded. Click Save changes.'; markDirty(); }
        catch (e) { status.textContent = e.message; }
        file.value = '';
      } });
      return el('div', { class: 'field' }, el('span', { text: label }),
        el('div', { class: 'image-field' }, img, el('span', { class: 'btn file-btn' }, 'Replace photo', file), status));
    }

    // A repeatable list (jobs, projects, skill groups...)
    function listField(obj, key, opts) {
      if (!Array.isArray(obj[key])) obj[key] = [];
      var arr = obj[key];
      var wrap = el('div', { class: 'list' });
      function render() {
        wrap.replaceChildren();
        arr.forEach(function (item, i) {
          var head = el('strong', { text: opts.title(item) || '(untitled)' });
          var refreshTitle = function () { head.textContent = opts.title(item) || '(untitled)'; };
          wrap.append(el('div', { class: 'item' },
            el('div', { class: 'item-head' }, head,
              el('button', { type: 'button', class: 'icon', title: 'Move up', 'aria-label': 'Move up', disabled: i === 0, onclick: function () { move(arr, i, -1); markDirty(); render(); } }, '↑'),
              el('button', { type: 'button', class: 'icon', title: 'Move down', 'aria-label': 'Move down', disabled: i === arr.length - 1, onclick: function () { move(arr, i, 1); markDirty(); render(); } }, '↓'),
              el('button', { type: 'button', class: 'small danger', onclick: function () {
                if (!confirm('Remove "' + (opts.title(item) || 'this item') + '"?')) return;
                arr.splice(i, 1); markDirty(); render();
              } }, 'Remove')
            ),
            opts.fields(item, refreshTitle)
          ));
        });
        wrap.append(el('div', null, el('button', { type: 'button', onclick: function () { arr.push(opts.make()); markDirty(); render(); } }, '+ ' + opts.addLabel)));
      }
      render();
      return wrap;
    }

    // ---------- image upload (resized in the browser first) ----------
    async function prepareImage(file, maxSize) {
      if (file.type === 'image/gif') return file;
      try {
        var bmp = await createImageBitmap(file);
        var scale = Math.min(1, maxSize / Math.max(bmp.width, bmp.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
        return await new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.86); }) || file;
      } catch (e) { return file; }
    }
    async function uploadImage(file, maxSize) {
      var blob = await prepareImage(file, maxSize || 2000);
      var res = await api('/api/upload', { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
      var body = await res.json().catch(function () { return {}; });
      if (res.status === 401) throw new Error('Your session expired. Log in again in a new tab, then retry.');
      if (!res.ok) throw new Error(body.error || 'Upload failed.');
      return body.src;
    }

    // ---------- sections ----------
    var editor = document.getElementById('editor');
    var jump = document.getElementById('jump');
    function section(id, title, body, open) {
      jump.append(el('a', { href: '#ed-' + id, text: title, onclick: function () { document.getElementById('ed-' + id).open = true; } }));
      editor.append(el('details', { class: 'section', id: 'ed-' + id, open: open || null }, el('summary', { text: title }), el('div', { class: 'section-body' }, body)));
    }

    var s = state;
    section('hero', 'Top of page (hero)', [
      imageField(s.hero, 'photo', 'Profile photo'),
      textField(s.hero, 'name', 'Name'),
      textField(s.hero, 'role', 'Title line'),
      textField(s.hero, 'eyebrow', 'Badge text', { help: 'The small green pill above your name. Leave blank to hide it.' }),
      textField(s.hero, 'intro', 'Intro', { multiline: true, rows: 4 }),
      textField(s.hero, 'email', 'Email'),
      textField(s.hero, 'linkedin', 'LinkedIn URL'),
      textField(s.hero, 'resume', 'Resume link', { help: 'Path to the PDF, e.g. /nov.11.resume.pdf' })
    ], true);

    // ---------- section order (swipeable categories) ----------
    var SECTION_NAMES = { education: 'Education', about: 'About Me', skills: 'Skills', projects: 'Projects', experience: 'Experience' };
    var DEFAULT_ORDER = ['education', 'about', 'skills', 'projects', 'experience'];
    if (!Array.isArray(s.sectionOrder)) s.sectionOrder = DEFAULT_ORDER.slice();
    s.sectionOrder = s.sectionOrder.filter(function (id, i, arr) { return SECTION_NAMES[id] && arr.indexOf(id) === i; })
      .concat(DEFAULT_ORDER.filter(function (id) { return s.sectionOrder.indexOf(id) === -1; }));
    var orderWrap = el('div', { class: 'list' });
    function renderOrder() {
      orderWrap.replaceChildren();
      s.sectionOrder.forEach(function (id, i) {
        orderWrap.append(el('div', { class: 'item-head item' },
          el('strong', { text: (i + 1) + '. ' + (s[id] && s[id].title || SECTION_NAMES[id]) }),
          el('button', { type: 'button', class: 'icon', title: 'Move up', 'aria-label': 'Move up', disabled: i === 0, onclick: function () { move(s.sectionOrder, i, -1); markDirty(); renderOrder(); } }, '↑'),
          el('button', { type: 'button', class: 'icon', title: 'Move down', 'aria-label': 'Move down', disabled: i === s.sectionOrder.length - 1, onclick: function () { move(s.sectionOrder, i, 1); markDirty(); renderOrder(); } }, '↓')
        ));
      });
    }
    renderOrder();
    section('order', 'Section order', [
      el('p', { class: 'hint', text: 'The order of the swipeable sections and the top menu. Photos and Contact always come after these.' }),
      orderWrap
    ]);

    section('about', 'About Me', [
      textField(s.about, 'title', 'Section title'),
      linesField(s.about, 'paragraphs', 'Paragraphs', 'Leave a blank line between paragraphs.', 'paras'),
      textField(s.about, 'note', 'Note under the text (optional)')
    ]);

    section('education', 'Education', [
      textField(s.education, 'title', 'Section title'),
      textField(s.education, 'school', 'School'),
      textField(s.education, 'degree', 'Degree'),
      textField(s.education, 'date', 'Graduation'),
      listField(s.education, 'details', {
        addLabel: 'Add detail', make: function () { return { label: 'New detail', text: '' }; },
        title: function (d) { return d.label; },
        fields: function (d, refresh) { return [textField(d, 'label', 'Label', { onchange: refresh }), textField(d, 'text', 'Text', { multiline: true, rows: 2 })]; }
      })
    ]);

    section('experience', 'Experience', [
      textField(s.experience, 'title', 'Section title'),
      listField(s.experience, 'jobs', {
        addLabel: 'Add job', make: function () { return { title: 'New role', company: '', location: '', dates: '', points: [] }; },
        title: function (j) { return [j.title, j.company].filter(Boolean).join(' · '); },
        fields: function (j, refresh) {
          return [textField(j, 'title', 'Job title', { onchange: refresh }), textField(j, 'company', 'Company', { onchange: refresh }),
            textField(j, 'location', 'Location'), textField(j, 'dates', 'Dates'), linesField(j, 'points', 'Bullet points', 'One per line.')];
        }
      })
    ]);

    section('projects', 'Projects', [
      textField(s.projects, 'title', 'Section title'),
      listField(s.projects, 'items', {
        addLabel: 'Add project', make: function () { return { tag: 'Personal Project', title: 'New project', points: [], stats: [], wide: false }; },
        title: function (p) { return p.title; },
        fields: function (p, refresh) {
          return [textField(p, 'title', 'Project name', { onchange: refresh }), textField(p, 'tag', 'Tag (e.g. Team Project, HackUTD 2026)'),
            linesField(p, 'points', 'Description / bullet points', 'One per line. A single line shows as a paragraph.'),
            statsField(p, 'stats', 'Highlight numbers (optional)'),
            textField(p, 'link', 'Link (optional)', { help: 'Full web address starting with https://, e.g. a GitHub repo, demo, Devpost or slides. Leave blank for no link.' }),
            textField(p, 'linkText', 'Link text', { help: 'What the link says. Leave blank to show "View project".' }),
            boolField(p, 'wide', 'Full-width card (best for projects with several bullet points)')];
        }
      })
    ]);

    section('skills', 'Skills', [
      textField(s.skills, 'title', 'Section title'),
      listField(s.skills, 'groups', {
        addLabel: 'Add skill group', make: function () { return { name: 'New group', items: [] }; },
        title: function (g) { return g.name; },
        fields: function (g, refresh) { return [textField(g, 'name', 'Group name', { onchange: refresh }), linesField(g, 'items', 'Skills', 'One per line.')]; }
      })
    ]);

    // ---------- photos manager ----------
    var photosWrap = el('div', { class: 'list' });
    function renderPhotos() {
      var cats = s.photos.categories;
      photosWrap.replaceChildren();
      if (!cats.length) photosWrap.append(el('p', { class: 'empty', text: 'No categories yet.' }));
      cats.forEach(function (cat, ci) {
        var grid = el('div', { class: 'photo-grid' });
        if (!cat.photos.length) grid.append(el('p', { class: 'empty', text: 'No photos yet. Empty categories are hidden on the public site.' }));
        cat.photos.forEach(function (p, pi) {
          var moveSel = el('select', { 'aria-label': 'Move to category', onchange: function () {
            var to = Number(moveSel.value);
            if (to === ci) return;
            cats[to].photos.push(cat.photos.splice(pi, 1)[0]); markDirty(); renderPhotos();
          } }, cats.map(function (c2, k) { return el('option', { value: k, selected: k === ci || null, text: k === ci ? 'Category: ' + c2.name : 'Move to ' + c2.name }); }));
          grid.append(el('div', { class: 'photo' },
            el('img', { src: p.src, alt: p.caption || '' }),
            el('div', { class: 'controls' },
              el('textarea', { rows: 4, placeholder: 'Caption (shown under the photo)', value: p.caption || '', 'aria-label': 'Caption', oninput: function (e) { p.caption = e.target.value; markDirty(); } }),
              el('div', { class: 'row' },
                el('button', { type: 'button', class: 'icon', title: 'Move left', 'aria-label': 'Move left', disabled: pi === 0, onclick: function () { move(cat.photos, pi, -1); markDirty(); renderPhotos(); } }, '←'),
                el('button', { type: 'button', class: 'icon', title: 'Move right', 'aria-label': 'Move right', disabled: pi === cat.photos.length - 1, onclick: function () { move(cat.photos, pi, 1); markDirty(); renderPhotos(); } }, '→'),
                moveSel,
                el('button', { type: 'button', class: 'icon danger', title: 'Remove photo', 'aria-label': 'Remove photo', onclick: function () {
                  if (!confirm('Remove this photo?')) return;
                  cat.photos.splice(pi, 1); markDirty(); renderPhotos();
                } }, '×')
              )
            )
          ));
        });

        var upStatus = el('span', { class: 'upload-status' });
        var fileInput = el('input', { type: 'file', accept: 'image/*', multiple: true, onchange: async function () {
          var files = Array.prototype.slice.call(fileInput.files);
          fileInput.value = '';
          for (var i = 0; i < files.length; i++) {
            upStatus.textContent = 'Uploading ' + (i + 1) + ' of ' + files.length + '…';
            try { cat.photos.push({ src: await uploadImage(files[i], 2000), caption: '' }); markDirty(); }
            catch (e) { upStatus.textContent = e.message; return; }
          }
          renderPhotos();
        } });

        photosWrap.append(el('div', { class: 'cat' },
          el('div', { class: 'cat-head' },
            el('input', { type: 'text', value: cat.name, 'aria-label': 'Category name', oninput: function (e) { cat.name = e.target.value; markDirty(); } }),
            el('button', { type: 'button', class: 'icon', title: 'Move category up', 'aria-label': 'Move category up', disabled: ci === 0, onclick: function () { move(cats, ci, -1); markDirty(); renderPhotos(); } }, '↑'),
            el('button', { type: 'button', class: 'icon', title: 'Move category down', 'aria-label': 'Move category down', disabled: ci === cats.length - 1, onclick: function () { move(cats, ci, 1); markDirty(); renderPhotos(); } }, '↓'),
            el('button', { type: 'button', class: 'small danger', onclick: function () {
              if (!confirm('Delete the category "' + cat.name + '"' + (cat.photos.length ? ' and its ' + cat.photos.length + ' photo(s)' : '') + '?')) return;
              cats.splice(ci, 1); markDirty(); renderPhotos();
            } }, 'Delete')
          ),
          grid,
          el('div', null, el('span', { class: 'btn file-btn' }, '+ Add photos', fileInput), ' ', upStatus)
        ));
      });
      photosWrap.append(el('div', null, el('button', { type: 'button', onclick: function () {
        var name = prompt('Name for the new category:', 'New category');
        if (!name) return;
        cats.push({ name: name.trim(), photos: [] }); markDirty(); renderPhotos();
      } }, '+ New category')));
    }
    renderPhotos();
    section('photos', 'Photos', [
      textField(s.photos, 'title', 'Section title'),
      textField(s.photos, 'text', 'Intro line', { multiline: true, rows: 2 }),
      el('p', { class: 'hint', text: 'Large photos are resized automatically before uploading. Removed photos are deleted when you save.' }),
      photosWrap
    ]);

    section('contact', 'Contact & footer', [
      textField(s.contact, 'title', 'Heading'),
      textField(s.contact, 'text', 'Text', { multiline: true, rows: 2 }),
      textField(s.contact, 'footer', 'Footer text (after your name)')
    ]);

    // ---------- save / logout ----------
    async function save() {
      saveBtn.disabled = true;
      setStatus('Saving…');
      try {
        var res = await api('/api/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
        var body = await res.json().catch(function () { return {}; });
        if (res.ok) { dirty = false; setStatus('Saved ✓', 'ok'); return; }
        if (res.status === 401) setStatus('Session expired. Open /admin in a new tab, log in, then click Save again.', 'err');
        else setStatus(body.error || 'Save failed.', 'err');
      } catch (e) { setStatus('Could not reach the server.', 'err'); }
      saveBtn.disabled = false;
    }
    saveBtn.addEventListener('click', save);
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (dirty) save(); }
    });
    document.getElementById('logout').addEventListener('click', async function () {
      if (dirty && !confirm('You have unsaved changes. Log out anyway?')) return;
      dirty = false;
      await api('/api/logout', { method: 'POST' }).catch(function () {});
      location.href = '/';
    });
    window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  })();
  </script>
</body>
</html>
